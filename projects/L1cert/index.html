<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Project page under construction." />

  <link rel="stylesheet" href="../../style.css" />

  <title>0616 — Page Not Found</title>

  <style>
    /*
      0616 — Generic unfinished-project landing page

      Theme:
      Uses the site's existing design tokens from style.css.
      No independent light/dark system is created here.
    */

    .not-found {
      position: relative;
      min-height: calc(100vh - var(--header-height) - 80px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
      isolation: isolate;
    }

    .not-found-content {
      position: relative;
      z-index: 2;
    }

    .not-found-code {
      margin: 0;
      color: var(--text);
      font-family: var(--mono);
      font-size: clamp(5rem, 18vw, 12rem);
      font-weight: 500;
      line-height: 0.82;
      letter-spacing: -0.08em;
    }

    .not-found-title {
      margin: var(--s-40) 0 var(--s-8);
      color: var(--text);
      font-size: var(--t-17);
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .not-found-desc {
      max-width: 520px;
      margin: 0;
      color: var(--text-muted);
      font-size: var(--t-13);
      line-height: 1.7;
    }

    .not-found-back {
      display: inline-block;
      margin-top: var(--s-32);
      font-family: var(--mono);
      font-size: var(--t-12);
      color: var(--text-muted);
      letter-spacing: 0.03em;
      transition: color var(--dur) var(--ease);
    }

    .not-found-back:hover {
      color: var(--text);
    }

    /*
      Minimal meteor field.

      Each meteor is a small dim streak moving diagonally across
      the viewport. Opacity is intentionally low so it remains
      secondary to the typography.
    */

    .meteor-field {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.7;
    }

    .meteor {
      position: absolute;
      width: 1px;
      height: 1px;
      background: var(--text);
      border-radius: 50%;
      box-shadow: 0 0 4px var(--text);
      transform: rotate(-45deg);
      opacity: 0;
      animation: meteor-fall linear infinite;
    }

    .meteor::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      width: var(--trail, 55px);
      height: 1px;
      background: linear-gradient(
        to left,
        transparent,
        var(--text-muted)
      );
      opacity: 0.55;
    }

    .meteor:nth-child(1) {
      left: 18%;
      top: -5%;
      --trail: 70px;
      animation-duration: 5.5s;
      animation-delay: 0.4s;
    }

    .meteor:nth-child(2) {
      left: 47%;
      top: -8%;
      --trail: 45px;
      animation-duration: 7s;
      animation-delay: 2.8s;
    }

    .meteor:nth-child(3) {
      left: 76%;
      top: 8%;
      --trail: 60px;
      animation-duration: 6.2s;
      animation-delay: 1.2s;
    }

    .meteor:nth-child(4) {
      left: 91%;
      top: 28%;
      --trail: 40px;
      animation-duration: 8s;
      animation-delay: 4s;
    }

    .meteor:nth-child(5) {
      left: 63%;
      top: 3%;
      --trail: 35px;
      animation-duration: 9s;
      animation-delay: 5.5s;
    }

    .meteor:nth-child(6) {
      left: 32%;
      top: 18%;
      --trail: 50px;
      animation-duration: 8.5s;
      animation-delay: 7s;
    }

    @keyframes meteor-fall {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0) rotate(-45deg);
      }

      8% {
        opacity: 0.5;
      }

      35% {
        opacity: 0.25;
      }

      55% {
        opacity: 0;
      }

      100% {
        opacity: 0;
        transform: translate3d(-260px, 260px, 0) rotate(-45deg);
      }
    }

    @media (max-width: 600px) {
      .not-found {
        min-height: calc(100vh - var(--header-height) - 48px);
      }

      .not-found-code {
        font-size: clamp(4.5rem, 27vw, 8rem);
      }

      .meteor-field {
        opacity: 0.5;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .meteor {
        animation: none;
        opacity: 0;
      }
    }
  </style>
</head>

<body>

<div class="site">

  <header class="site-header">
    <div class="header-inner">

      <a href="../../" class="header-name">main</a>

      <nav class="header-nav">
        <a href="../" class="nav-link active">projects</a>
        <a href="../../bookshelf/" class="nav-link">bookshelf</a>
      </nav>

      <div class="header-controls">
        <button id="mode-toggle" class="ctrl-btn" aria-label="Toggle theme">○</button>
      </div>

    </div>
  </header>

  <main class="page-content">

    <div class="not-found">

      <div class="meteor-field" aria-hidden="true">
        <span class="meteor"></span>
        <span class="meteor"></span>
        <span class="meteor"></span>
        <span class="meteor"></span>
        <span class="meteor"></span>
        <span class="meteor"></span>
      </div>

      <div class="not-found-content">

        <p class="not-found-code">0616</p>

        <h1 class="not-found-title">Page not found</h1>

        <p class="not-found-desc">
          This project has not been documented yet.
          The work exists, but its documentation is still being developed.
        </p>

        <a href="../" class="not-found-back">← Projects</a>

      </div>

    </div>

  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-text">Luis Alejandro Rodríguez Arenas</span>
    </div>
  </footer>

</div>

<script src="../project.js"></script>

</body>
</html>
