  <style>
    /*
      0616 — Generic unfinished-project landing page

      Theme:
      Uses the site's existing design tokens from style.css.
      Theme persistence is handled by project.js.
    */

    /* =========================================================
       PAGE LAYERS
       ========================================================= */

    .not-found {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - var(--header-height) - 80px);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;

      overflow: hidden;
    }

    .not-found-content {
      position: relative;
      z-index: 2;
    }


    /* =========================================================
       0616 CONTENT
       ========================================================= */

    .not-found-code {
      margin: 0;

      color: var(--text);
      font-family: var(--mono);
      font-size: clamp(5rem, 18vw, 12rem);
      font-weight: 500;
      line-height: 0.82;
      letter-spacing: -0.08em;
    }

    .not-found-title {
      margin: var(--s-40) 0 var(--s-8);

      color: var(--text);
      font-size: var(--t-17);
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .not-found-desc {
      max-width: 520px;
      margin: 0;

      color: var(--text-muted);
      font-size: var(--t-13);
      line-height: 1.7;
    }

    .not-found-back {
      display: inline-block;
      margin-top: var(--s-32);

      color: var(--text-muted);
      font-family: var(--mono);
      font-size: var(--t-12);
      letter-spacing: 0.03em;

      transition: color var(--dur) var(--ease);
    }

    .not-found-back:hover {
      color: var(--text);
    }


    /* =========================================================
       METEOR FIELD

       The field is intentionally outside .not-found so it is
       independent from the page's stacking context.

       Each meteor is a small stack of plain ASCII "/" glyphs
       (no blur/glow). "/" is already drawn on the same NE-SW
       diagonal the meteor falls along, so the head sits at
       offset (0,0) and each trailing glyph is nudged up-right
       (opposite the direction of travel) with lower opacity -
       that's the whole trail, done with real characters.

       Fallback colors (var(--text, #141414)) keep the field
       visible even if ../../style.css fails to load.
       ========================================================= */

    .meteor-field {
      position: fixed;
      inset: 0;

      z-index: 0;

      pointer-events: none;
      overflow: hidden;

      /* Keep the effect subtle */
      opacity: 0.8;
    }

    .meteor {
      position: absolute;

      font-family: var(--mono, monospace);
      font-size: 1.2rem;
      line-height: 1;

      opacity: 0;

      animation: meteor-fall 6s linear infinite;
    }

    .meteor span {
      position: absolute;
      top: 0;
      left: 0;

      color: var(--text, #141414);
    }

    /* Head: full strength, no offset */
    .meteor span:nth-child(1) {
      opacity: 1;
      transform: translate(0, 0);
    }

    /* Trail: each glyph further up-right, further faded */
    .meteor span:nth-child(2) {
      opacity: 0.7;
      transform: translate(6px, -6px);
    }

    .meteor span:nth-child(3) {
      opacity: 0.45;
      transform: translate(12px, -12px);
    }

    .meteor span:nth-child(4) {
      opacity: 0.25;
      transform: translate(18px, -18px);
    }

    .meteor span:nth-child(5) {
      opacity: 0.1;
      transform: translate(24px, -24px);
    }


    /* =========================================================
       METEOR POSITIONS

       Different delays prevent the animation from looking
       synchronized or repetitive.
       ========================================================= */

    .meteor:nth-of-type(1) {
      left: 12%;
      top: 8%;

      animation-delay: 0s;
    }

    .meteor:nth-of-type(2) {
      left: 34%;
      top: 2%;

      animation-delay: 2.1s;
    }

    .meteor:nth-of-type(3) {
      left: 57%;
      top: 14%;

      animation-delay: 4.3s;
    }

    .meteor:nth-of-type(4) {
      left: 76%;
      top: 5%;

      animation-delay: 1.2s;
    }

    .meteor:nth-of-type(5) {
      left: 91%;
      top: 28%;

      animation-delay: 3.5s;
    }

    .meteor:nth-of-type(6) {
      left: 45%;
      top: 35%;

      animation-delay: 5.2s;
    }


    /* =========================================================
       METEOR ANIMATION
       ========================================================= */

    @keyframes meteor-fall {

      0% {
        opacity: 0;

        transform: translate3d(0, 0, 0);
      }

      5% {
        opacity: 0.85;
      }

      18% {
        opacity: 0.6;
      }

      32% {
        opacity: 0.2;
      }

      42% {
        opacity: 0;
      }

      100% {
        opacity: 0;

        transform: translate3d(-260px, 260px, 0);
      }
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      .not-found {
        min-height: calc(100vh - var(--header-height) - 48px);
      }

      .not-found-code {
        font-size: clamp(4.5rem, 27vw, 8rem);
      }

      .meteor-field {
        opacity: 0.65;
      }

      .meteor {
        font-size: 1rem;
      }
    }


    /* =========================================================
       ACCESSIBILITY
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      .meteor {
        animation: none;
        opacity: 0;
      }
    }
  </style>
</head>
