<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reading Challenge 2026" />

  <title>Reading Challenge 2026</title>

  <link rel="icon" href="../../assets/profile.jpg" type="image/x-icon">
  <link rel="stylesheet" href="../../style.css">
</head>

<body>

<div class="site">

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="../../" class="header-name">main</a>

      <nav class="header-nav">
        <a href="../../projects/" class="nav-link">projects</a>
        <a href="../" class="nav-link active">bookshelf</a>
      </nav>

      <div class="header-controls">
        <button id="mode-toggle" class="ctrl-btn" aria-label="Toggle theme">
          ○
        </button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="page-content">

    <a href="../" class="page-back">← Bookshelf</a>

    <div class="article-header">
      <h1 class="page-title">Reading Challenge 2026</h1>

      <p>
        Books read during 2026. This is an except from my Obsidian notes system but populates every month or so, so not up to date always.
      </p>
    </div>

    <hr class="rule">

    <section id="reading-heatmap"></section>

    <br><br>

    <section id="reading-challenge"></section>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-text">
        Luis Alejandro Rodríguez Arenas
      </span>
    </div>
  </footer>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // Theme toggle
  const modeBtn = document.getElementById("mode-toggle");

  function applyTheme(isLight) {
    document.body.classList.toggle("light-mode", isLight);
    modeBtn.textContent = isLight ? "●" : "○";
  }

  applyTheme(localStorage.getItem("mode") === "light");

  modeBtn.addEventListener("click", () => {
    const isLight = !document.body.classList.contains("light-mode");
    applyTheme(isLight);
    localStorage.setItem("mode", isLight ? "light" : "dark");
  });

  // Load widgets
  async function loadWidget(file, target) {
    try {
      const html = await fetch(file).then(r => r.text());
      document.getElementById(target).innerHTML = html;
    } catch (err) {
      console.error(`Failed to load ${file}`, err);
    }
  }

  loadWidget("reading-heatmap.html", "reading-heatmap");
  loadWidget("reading-challenge.html", "reading-challenge");

});
</script>

</body>
</html>
